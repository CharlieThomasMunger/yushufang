<title id="title">看一个重大选择的四个方向</title><desc id="desc">玉书房看重大选择的四个方向：人包含禀赋、能力、资源、认知、家庭；时包含阶段、周期、趋势、窗口；载体包含学校、公司、行业、城市、国家；规则包含法律、身份、市场、税制、制度。中央是布局与重大选择。</desc>
