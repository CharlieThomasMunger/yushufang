<text x="38" y="43" font-size="17" fill="#61726b" font-weight="500" text-anchor="start">YUSHUFANG / 02</text>
<text x="38" y="102" font-size="34" fill="#233e38" font-weight="600" text-anchor="start">看一个重大选择的四个方向</text>
