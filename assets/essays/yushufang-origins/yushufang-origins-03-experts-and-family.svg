<svg xmlns="http://www.w3.org/2000/svg" width="640" height="841" viewBox="0 0 640 841" role="img" aria-labelledby="title desc">
<title id="title">专家看局部，家庭承担整体</title><desc id="desc">教育、法律与身份、税务、财富、健康五个专业方向围绕家庭整体判断相互连接。专家负责把局部看深，家庭必须有人负责整体判断；局部都正确，不代表整体一定正确。</desc>
<style>text{font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif} .serif{font-family:'Noto Serif SC','SimSun',serif}</style>
<rect width="640" height="841" rx="12" fill="#f3f5f2"/>
<text x="38" y="43" font-size="17" fill="#61726b" font-weight="500" text-anchor="start">YUSHUFANG / 03</text>
<text x="38" y="102" font-size="34" fill="#233e38" font-weight="600" text-anchor="start">专家看局部，家庭承担整体</text>
