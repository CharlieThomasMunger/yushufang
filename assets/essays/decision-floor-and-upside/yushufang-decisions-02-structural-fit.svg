<svg xmlns="http://www.w3.org/2000/svg" width="640" height="696" viewBox="0 0 640 696" role="img" aria-labelledby="title desc"><title id="title">真正的适合是结构匹配</title><desc id="desc">人、家庭、时、社会围绕同一个问题：这个人进入这个世界以后，会发生什么？这些是观察方向，不是新的四层理论。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#82988b" stroke-width="1.3"/></marker></defs><rect width="640" height="696" rx="18" fill="#f3f5f2"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="320" y="57" font-size="34" fill="#263d3a" font-weight="600" text-anchor="middle">真正的“适合”</text><text x="320" y="105" font-size="34" fill="#263d3a" font-weight="600" text-anchor="middle">是结构匹配</text><rect x="32" y="146" width="270" height="159" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="167" y="193" font-size="36" fill="#263d3a" font-weight="600" text-anchor="middle">人</text><text x="167" y="242" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">禀赋 · 能力</text><text x="167" y="280" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">健康 · 认知</text><rect x="338" y="146" width="270" height="159" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="473" y="193" font-size="36" fill="#263d3a" font-weight="600" text-anchor="middle">家庭</text><text x="473" y="242" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">收入 · 责任</text><text x="473" y="280" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">资产 · 机会</text><rect x="32" y="495" width="270" height="159" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="167" y="542" font-size="36" fill="#263d3a" font-weight="600" text-anchor="middle">时</text><text x="167" y="591" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">年龄 · 阶段</text><text x="167" y="629" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">周期 · 窗口</text><rect x="338" y="495" width="270" height="159" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="473" y="542" font-size="36" fill="#263d3a" font-weight="600" text-anchor="middle">社会</text><text x="473" y="591" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">学校 · 行业</text><text x="473" y="629" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">制度 · 规则</text><path d="M167 310 L167 344" fill="none" stroke="#82988b" stroke-width="2.5"/><path d="M167 458 L167 491" fill="none" stroke="#82988b" stroke-width="2.5"/><path d="M473 310 L473 344" fill="none" stroke="#82988b" stroke-width="2.5"/><path d="M473 458 L473 491" fill="none" stroke="#82988b" stroke-width="2.5"/><rect x="32" y="350" width="576" height="104" rx="14" fill="#254f43" stroke="#254f43"/><text x="320" y="391" font-size="30" fill="#ffffff" font-weight="500" text-anchor="middle">这个人进入这个世界以后，</text><text x="320" y="434" font-size="30" fill="#ffffff" font-weight="500" text-anchor="middle">会发生什么？</text></g></svg>