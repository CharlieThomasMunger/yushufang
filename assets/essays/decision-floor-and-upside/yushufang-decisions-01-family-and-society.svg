<svg xmlns="http://www.w3.org/2000/svg" width="640" height="725" viewBox="0 0 640 725" role="img" aria-labelledby="title desc"><title id="title">家庭能够提供多少，决定需要社会提供多少</title><desc id="desc">两种假设家庭：一类可提供企业平台、资本和行业入口；另一类主要提供教育费用和生活支持。后者需要更重视外部机会，但两者都依赖社会。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#82988b" stroke-width="1.3"/></marker></defs><rect width="640" height="725" rx="18" fill="#f3f5f2"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="320" y="58" font-size="32" fill="#263d3a" font-weight="600" text-anchor="middle">家庭能够提供多少，</text><text x="320" y="104" font-size="32" fill="#263d3a" font-weight="600" text-anchor="middle">决定需要社会提供多少</text><rect x="32" y="151" width="270" height="437" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="167" y="201" font-size="30" fill="#263d3a" font-weight="600" text-anchor="middle">家庭可提供</text><text x="167" y="243" font-size="30" fill="#263d3a" font-weight="600" text-anchor="middle">后续机会</text><text x="167" y="313" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">企业平台</text><text x="167" y="362" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">创业资本</text><text x="167" y="411" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">行业入口</text><path d="M167 433 L167 458" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="167" y="512" font-size="25" fill="#263d3a" font-weight="400" text-anchor="middle">对普通就业市场</text><text x="167" y="548" font-size="25" fill="#263d3a" font-weight="400" text-anchor="middle">依赖可能降低</text><rect x="338" y="151" width="270" height="437" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="473" y="201" font-size="30" fill="#263d3a" font-weight="600" text-anchor="middle">家庭主要提供</text><text x="473" y="243" font-size="30" fill="#263d3a" font-weight="600" text-anchor="middle">教育投入</text><text x="473" y="313" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">教育费用</text><text x="473" y="362" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">生活支持</text><text x="473" y="411" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">部分帮助</text><path d="M473 433 L473 458" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="473" y="512" font-size="25" fill="#263d3a" font-weight="400" text-anchor="middle">更需重视外部</text><text x="473" y="548" font-size="25" fill="#263d3a" font-weight="400" text-anchor="middle">产业与制度入口</text><text x="320" y="647" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">两种家庭都依赖社会的</text><text x="320" y="687" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">制度、市场与基础设施</text></g></svg>