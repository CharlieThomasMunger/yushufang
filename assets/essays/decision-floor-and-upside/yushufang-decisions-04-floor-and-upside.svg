<svg xmlns="http://www.w3.org/2000/svg" width="640" height="757" viewBox="0 0 640 757" role="img" aria-labelledby="title desc"><title id="title">重大决策的底线与上限</title><desc id="desc">候选方案向下检查硬约束，向上判断高质量选择权。底线决定能不能选，上限决定值不值得选。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#82988b" stroke-width="1.3"/></marker></defs><rect width="640" height="757" rx="18" fill="#f3f5f2"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="320" y="64" font-size="34" fill="#263d3a" font-weight="600" text-anchor="middle">重大决策的底线与上限</text><rect x="32" y="113" width="576" height="180" rx="14" fill="#dfe9df" stroke="#d6ded9"/><text x="320" y="166" font-size="33" fill="#263d3a" font-weight="600" text-anchor="middle">上限 · 高质量选择权</text><text x="320" y="222" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">职业 · 地域 · 教育</text><text x="320" y="262" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">身份 · 资产 · 未来路径</text><path d="M320 351 L320 310" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="162" y="366" width="316" height="91" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="320" y="423" font-size="36" fill="#263d3a" font-weight="600" text-anchor="middle">候选方案</text><path d="M320 472 L320 515" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="533" width="576" height="183" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="320" y="588" font-size="33" fill="#263d3a" font-weight="600" text-anchor="middle">底线 · 硬约束</text><text x="320" y="643" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">预算 · 收入 · 家庭 · 教育</text><text x="320" y="683" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">身份 · 时间 · 风险</text></g></svg>