<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title desc"><title id="title">重大决策先过底线门</title><desc id="desc">检查预算、工作与收入、教育、家庭责任、身份权利、时间窗口和最坏损失。撞穿关键约束的方案淘汰；通过的方案才继续比较。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#82988b" stroke-width="1.3"/></marker></defs><rect width="640" height="790" rx="18" fill="#f3f5f2"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="320" y="65" font-size="36" fill="#263d3a" font-weight="600" text-anchor="middle">重大决策先过底线门</text><text x="320" y="117" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">候选方案</text><path d="M320 137 L320 171" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="188" width="576" height="340" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="320" y="237" font-size="30" fill="#263d3a" font-weight="600" text-anchor="middle">逐项检查关键硬约束</text><rect x="55" y="264" width="251" height="53" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="180" y="300" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">预算</text><rect x="333" y="264" width="251" height="53" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="458" y="300" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">工作与收入</text><rect x="55" y="333" width="251" height="53" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="180" y="369" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">教育</text><rect x="333" y="333" width="251" height="53" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="458" y="369" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">家庭责任</text><rect x="55" y="402" width="251" height="53" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="180" y="438" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">身份权利</text><rect x="333" y="402" width="251" height="53" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="458" y="438" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">时间窗口</text><text x="320" y="499" font-size="29" fill="#263d3a" font-weight="400" text-anchor="middle">最坏损失</text><path d="M320 529 L320 552" fill="none" stroke="#82988b" stroke-width="2.5"/><path d="M162 552 L478 552" fill="none" stroke="#82988b" stroke-width="2.5"/><path d="M162 552 L162 585" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M478 552 L478 585" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="602" width="260" height="147" rx="14" fill="#f0ede7" stroke="#d9d2c6"/><text x="162" y="649" font-size="29" fill="#263d3a" font-weight="500" text-anchor="middle">撞穿关键约束</text><text x="162" y="703" font-size="29" fill="#263d3a" font-weight="500" text-anchor="middle">淘汰</text><rect x="338" y="602" width="270" height="147" rx="14" fill="#dfe9df" stroke="#d6ded9"/><text x="473" y="649" font-size="29" fill="#263d3a" font-weight="500" text-anchor="middle">关键约束通过</text><text x="473" y="703" font-size="29" fill="#263d3a" font-weight="500" text-anchor="middle">继续比较</text></g></svg>