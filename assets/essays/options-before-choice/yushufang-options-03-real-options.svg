<svg xmlns="http://www.w3.org/2000/svg" width="640" height="730" viewBox="0 0 640 730" role="img" aria-labelledby="title desc"><title id="title">真实选项的三道门</title><desc id="desc">看得见、进得去、承担得起，三个条件同时满足，纸面上的可能性才成为真实选项。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#82988b" stroke-width="1.3"/></marker></defs><rect width="640" height="730" rx="18" fill="#f3f5f2"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="320" y="65" font-size="36" fill="#263d3a" font-weight="600" text-anchor="middle">真实选项的三道门</text><rect x="32" y="108" width="576" height="133" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="61" y="159" font-size="28" fill="#728977" font-weight="400" text-anchor="start">01</text><text x="165" y="159" font-size="36" fill="#263d3a" font-weight="600" text-anchor="start">看得见</text><text x="61" y="206" font-size="28" fill="#263d3a" font-weight="400" text-anchor="start">进入你的认知与候选名单</text><path d="M320 250 L320 271" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="276" width="576" height="133" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="61" y="327" font-size="28" fill="#728977" font-weight="400" text-anchor="start">02</text><text x="165" y="327" font-size="36" fill="#263d3a" font-weight="600" text-anchor="start">进得去</text><text x="61" y="374" font-size="28" fill="#263d3a" font-weight="400" text-anchor="start">符合真正的进入条件</text><path d="M320 418 L320 439" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="444" width="576" height="133" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="61" y="495" font-size="28" fill="#728977" font-weight="400" text-anchor="start">03</text><text x="165" y="495" font-size="36" fill="#263d3a" font-weight="600" text-anchor="start">承担得起</text><text x="61" y="542" font-size="28" fill="#263d3a" font-weight="400" text-anchor="start">付得起成本，也承受得住后果</text><path d="M320 586 L320 607" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="150" y="623" width="340" height="73" rx="14" fill="#254f43" stroke="#254f43"/><text x="320" y="672" font-size="36" fill="#ffffff" font-weight="600" text-anchor="middle">真实选项</text></g></svg>