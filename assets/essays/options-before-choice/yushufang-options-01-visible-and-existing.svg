<svg xmlns="http://www.w3.org/2000/svg" width="640" height="586" viewBox="0 0 640 586" role="img" aria-labelledby="title desc"><title id="title">你看到的选项 ≠ 真正存在的选项</title><desc id="desc">左侧眼前候选只有A、B、C；右侧世界中还有D、E、F。看见哪些选项，影响比较的起点。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#82988b" stroke-width="1.3"/></marker></defs><rect width="640" height="586" rx="18" fill="#f3f5f2"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="320" y="62" font-size="34" fill="#263d3a" font-weight="600" text-anchor="middle">你看到的选项</text><text x="320" y="110" font-size="34" fill="#263d3a" font-weight="600" text-anchor="middle">≠ 真正存在的选项</text><rect x="32" y="158" width="240" height="330" rx="14" fill="#ffffff" stroke="#d6ded9"/><rect x="338" y="158" width="270" height="330" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="152" y="204" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">眼前的候选</text><text x="473" y="204" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">世界的可能</text><rect x="100" y="232" width="104" height="52" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="152" y="268" font-size="32" fill="#263d3a" font-weight="400" text-anchor="middle">A</text><rect x="100" y="304" width="104" height="52" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="152" y="340" font-size="32" fill="#263d3a" font-weight="400" text-anchor="middle">B</text><rect x="100" y="376" width="104" height="52" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="152" y="412" font-size="32" fill="#263d3a" font-weight="400" text-anchor="middle">C</text><rect x="362" y="231" width="86" height="52" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="405" y="266" font-size="32" fill="#263d3a" font-weight="400" text-anchor="middle">A</text><rect x="492" y="231" width="86" height="52" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="535" y="266" font-size="32" fill="#263d3a" font-weight="400" text-anchor="middle">B</text><rect x="362" y="303" width="86" height="52" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="405" y="338" font-size="32" fill="#263d3a" font-weight="400" text-anchor="middle">C</text><rect x="492" y="303" width="86" height="52" rx="14" fill="#dfe9df" stroke="#d6ded9"/><text x="535" y="338" font-size="32" fill="#263d3a" font-weight="600" text-anchor="middle">D</text><rect x="362" y="375" width="86" height="52" rx="14" fill="#dfe9df" stroke="#d6ded9"/><text x="405" y="410" font-size="32" fill="#263d3a" font-weight="600" text-anchor="middle">E</text><rect x="492" y="375" width="86" height="52" rx="14" fill="#dfe9df" stroke="#d6ded9"/><text x="535" y="410" font-size="32" fill="#263d3a" font-weight="600" text-anchor="middle">F</text><text x="305" y="333" font-size="40" fill="#263d3a" font-weight="400" text-anchor="middle">≠</text><text x="320" y="545" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">还没看见，不等于不存在。</text></g></svg>