<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img" aria-labelledby="title desc"><title id="title">重大决策的打开与收窄</title><desc id="desc">第一阶段打开地图，让重要可能性进入视野；第二阶段根据需求、约束、风险和长期价值快速收窄。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#82988b" stroke-width="1.3"/></marker></defs><rect width="640" height="710" rx="18" fill="#f3f5f2"/><g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="40" y="61" font-size="32" fill="#263d3a" font-weight="600" text-anchor="start">重大决策的“打开—收窄”</text><rect x="32" y="104" width="576" height="202" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="61" y="155" font-size="35" fill="#263d3a" font-weight="600" text-anchor="start">01  打开地图</text><text x="61" y="201" font-size="28" fill="#263d3a" font-weight="400" text-anchor="start">让重要可能性进入视野</text><text x="87" y="266" font-size="34" fill="#52745e" font-weight="500" text-anchor="middle">A</text><text x="181" y="266" font-size="34" fill="#52745e" font-weight="500" text-anchor="middle">B</text><text x="275" y="266" font-size="34" fill="#52745e" font-weight="500" text-anchor="middle">C</text><text x="369" y="266" font-size="34" fill="#52745e" font-weight="500" text-anchor="middle">D</text><text x="463" y="266" font-size="34" fill="#52745e" font-weight="500" text-anchor="middle">E</text><text x="557" y="266" font-size="34" fill="#52745e" font-weight="500" text-anchor="middle">F</text><path d="M320 319 L320 350" fill="none" stroke="#82988b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="369" width="576" height="304" rx="14" fill="#ffffff" stroke="#d6ded9"/><text x="61" y="420" font-size="35" fill="#263d3a" font-weight="600" text-anchor="start">02  快速收窄</text><rect x="58" y="450" width="249" height="59" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="182" y="490" font-size="30" fill="#263d3a" font-weight="400" text-anchor="middle">需求</text><rect x="333" y="450" width="249" height="59" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="457" y="490" font-size="30" fill="#263d3a" font-weight="400" text-anchor="middle">约束</text><rect x="58" y="526" width="249" height="59" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="182" y="566" font-size="30" fill="#263d3a" font-weight="400" text-anchor="middle">风险</text><rect x="333" y="526" width="249" height="59" rx="14" fill="#f3f5f2" stroke="#d6ded9"/><text x="457" y="566" font-size="30" fill="#263d3a" font-weight="400" text-anchor="middle">长期价值</text><text x="320" y="638" font-size="28" fill="#263d3a" font-weight="400" text-anchor="middle">留下值得深入研究的方案</text></g></svg>