title: 玉书房
description: "关于命运结构、真实选项与家庭重大选择的研究与写作。"
url: "https://yushufang.org"
baseurl: ""
lang: zh-Hans
timezone: Europe/Paris
author:
  name: 刘一卜
  url: https://yushufang.org/about/
permalink: /essays/:title/
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-feed
collections:
  en:
    output: true
    permalink: /en/essays/:path/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: zh-Hans
      body_class: reading
      author: 刘一卜
  - scope:
      path: ""
      type: en
    values:
      layout: post
      lang: en
      body_class: "reading international"
      author: Liu Yibu
exclude:
  - README.md
  - INSTALL.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
