<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh-Hans' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | 玉书房</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
{% include hreflang.html %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="玉书房">
<meta property="og:title" content="{{ page.title }}">
{% if page.description %}<meta property="og:description" content="{{ page.description }}">{% endif %}
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<link rel="alternate" type="application/rss+xml" title="玉书房" href="{{ '/feed.xml' | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EE;
    --ink:#191713;
    --ink-soft:#4A463E;
    --ink-faint:#8B8579;
    --cinnabar:#9E2B25;
    --rule:rgba(25,23,19,.16);
    --cjk:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC","SimSun",serif;
    --latin:"Source Serif 4",Georgia,"Times New Roman",serif;
    --measure:36rem;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--latin),var(--cjk);
    font-size:17px;line-height:1.9;letter-spacing:.01em;
    text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  }
  .spine{
    position:fixed;top:0;left:0;height:100vh;width:6.5rem;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:5;
  }
  .spine img{width:2.9rem;height:auto;opacity:.92}
  .mark-mobile{display:none}
  .sitenav{
    max-width:var(--measure);margin:0 auto;
    padding:2.2rem 1.5rem 0;
    display:flex;gap:2.1rem;align-items:baseline;
  }
  .sitenav a{
    font-family:var(--cjk);font-size:.94rem;letter-spacing:.2em;
    color:var(--ink-faint);text-decoration:none;
    padding-bottom:.25rem;border-bottom:1px solid transparent;
    transition:color .25s,border-color .25s;
  }
  .sitenav a:hover{color:var(--ink);border-bottom-color:var(--cinnabar)}
  .sitenav a[aria-current="page"]{color:var(--ink)}
  .sitenav .langs{margin-left:auto;display:flex;gap:.9rem}
  .sitenav .langs a{
    font-family:var(--latin);font-size:.78rem;letter-spacing:.1em;
    color:var(--ink-faint);border-bottom:none;
  }
  .sitenav .langs a.on{color:var(--ink)}
  .sitenav .langs a:hover{color:var(--cinnabar)}
  main{max-width:var(--measure);margin:0 auto;padding:4.5rem 1.5rem 6rem}
  h1{
    font-family:var(--cjk);font-weight:600;
    font-size:clamp(1.4rem,3.6vw,1.85rem);
    line-height:1.7;letter-spacing:.02em;margin:0 0 2.6rem;
  }
  h2{
    font-family:var(--cjk);font-weight:600;font-size:1.18rem;
    line-height:1.7;margin:3.2rem 0 1.3rem;letter-spacing:.02em;
  }
  p,li{font-family:var(--cjk)}
  p{margin:0 0 1.45rem;color:var(--ink-soft)}
  main p:first-of-type{color:var(--ink)}
  strong{font-weight:600;color:var(--ink)}
  a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
  a:hover{border-bottom-color:var(--cinnabar)}
  .meta{
    font-family:var(--latin);font-size:.82rem;color:var(--ink-faint);
    letter-spacing:.06em;margin:-1.6rem 0 2.8rem;
  }
  .post-list{list-style:none;margin:0;padding:0}
  .post-list li{
    padding:1.5rem 0;border-bottom:1px solid var(--rule);
  }
  .post-list li:first-child{border-top:1px solid var(--rule)}
  .post-list a{
    display:block;font-size:1.08rem;font-weight:600;
    border-bottom:none;margin-bottom:.35rem;
  }
  .post-list time{
    font-family:var(--latin);font-size:.8rem;
    color:var(--ink-faint);letter-spacing:.08em;
  }
  .post-list .excerpt{color:var(--ink-soft);font-size:.96rem;margin:.5rem 0 0}
  footer{
    border-top:1px solid var(--rule);max-width:var(--measure);
    margin:0 auto;padding:3rem 1.5rem 5rem;
  }
  .colophon{
    font-family:var(--latin);font-size:.8rem;
    color:var(--ink-faint);letter-spacing:.06em;margin:0;
  }
  :focus-visible{outline:2px solid var(--cinnabar);outline-offset:3px}
  @media (max-width:900px){
    .spine{display:none}
    .mark-mobile{display:block;max-width:var(--measure);margin:0 auto;padding:2.4rem 1.5rem 0}
    .mark-mobile img{width:9.5rem;height:auto;opacity:.92}
    .sitenav{padding-top:1.6rem;gap:1.6rem}
    .sitenav a{font-size:.88rem;letter-spacing:.14em}
    main{padding-top:3rem}
    body{font-size:16px;line-height:1.85}
  }
</style>
</head>
<body>

<div class="spine" aria-hidden="true">
  <img src="/logo-vertical.png" alt="">
</div>

<div class="mark-mobile">
  <a href="/"><img src="/logo-horizontal.png" alt="玉书房"></a>
</div>

{% include nav.html %}

<main>
  <h1>{{ page.title }}</h1>
  {{ content }}
</main>

<footer>
  <p class="colophon">玉书房 · The Jade Study</p>
</footer>

</body>
</html>
