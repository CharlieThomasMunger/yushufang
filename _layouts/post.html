---
layout: default
---
<main id="main" class="reading-main"><article><span class="eyebrow">{{ page.category_label }}</span><h1>{{ page.title }}</h1><p class="reading-summary">{{ page.description }}</p><div class="reading-meta"><span>{{ page.author }}</span><span>首发 <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time></span><span>修订 <time datetime="{{ page.last_updated | default: page.date | date_to_xmlschema }}">{{ page.last_updated | default: page.date | date: '%Y-%m-%d' }}</time></span><span>v{{ page.version }}</span></div><div class="prose">{{ content }}</div><a class="blue-link" href="/essays/">返回文章目录 <span>›</span></a></article></main>
