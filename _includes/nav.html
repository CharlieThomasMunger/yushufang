{% assign nav = site.data.navigation[page.lang] %}
<header class="site-header"><a class="brand" href="{{ nav.home | relative_url }}" aria-label="玉书房 / Yushufang"><img src="{{ '/logo-horizontal.png' | relative_url }}" width="1798" height="621" alt="玉书房 / Yushufang"></a><nav class="main-nav" aria-label="Navigation">{% for item in nav.items %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</nav><nav class="site-languages" aria-label="Language"><a lang="zh-Hans" href="{{ page.translations['zh-Hans'] | default: '/' | relative_url }}"{% if page.lang == 'zh-Hans' %} aria-current="page"{% endif %}>中文</a><a lang="en" href="{{ page.translations.en | default: '/en/' | relative_url }}"{% if page.lang == 'en' %} aria-current="page"{% endif %}>EN</a><a lang="fr" href="{{ page.translations.fr | default: '/fr/' | relative_url }}"{% if page.lang == 'fr' %} aria-current="page"{% endif %}>FR</a></nav></header>
