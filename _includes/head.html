<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% if page.url == '/' %}<meta name="google-site-verification" content="dP_7iDLCGP-hyS0UaRheaMPfEIJur37LSfItRdoTrLw">{% endif %}
<title>{{ page.title | escape }} | 玉书房</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="author" content="{{ page.author | escape }}">
{% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% include hreflang.html %}
<meta property="og:site_name" content="玉书房 / Yushufang">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.version %}article{% else %}website{% endif %}">
<meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% elsif page.lang == 'fr' %}fr_FR{% else %}zh_CN{% endif %}">
<meta property="og:image" content="https://yushufang.org/logo-horizontal.png">
<meta property="og:image:alt" content="玉书房 / Yushufang">
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light">
<link rel="alternate" type="application/atom+xml" title="玉书房文章" href="{{ '/feed.xml' | absolute_url }}">
<link rel="icon" href="{{ '/logo-horizontal.png' | relative_url }}" type="image/png">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.github.build_revision | default: '20260929-copy2' }}">
{% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}
<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
{% include structured-data.html %}
